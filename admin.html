<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADR — Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

    <main class="admin-wrap">

        <header class="admin-top">
            <h1>ADR — DRIP CULTURE</h1>
            <p>Painel administrativo</p>
        </header>

        <!-- LOGIN -->
        <section class="admin-panel" id="login-panel">
            <h2>Acessar painel</h2>
            <p>Entre com sua conta de administrador.</p>

            <form id="login-form">
                <div class="admin-form-grid">
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Seu e-mail"
                        required
                    >

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Sua senha"
                        required
                    >
                </div>

                <button type="submit" id="login-button">
                    Entrar
                </button>

                <p id="login-status"></p>
            </form>
        </section>

        <!-- PAINEL -->
        <div id="admin-dashboard" hidden>

<section class="admin-stats">
    <div class="stat-card">
        <span>Total de produtos</span>
        <strong id="stat-total">0</strong>
    </div>

    <div class="stat-card">
        <span>Produtos ativos</span>
        <strong id="stat-active">0</strong>
    </div>

    <div class="stat-card">
        <span>Produtos inativos</span>
        <strong id="stat-inactive">0</strong>
    </div>
</section>

            <section class="admin-panel">
                <div class="admin-top">
                    <div>
                        <h2>Gerenciar produtos</h2>
                        <p id="admin-user"></p>
                    </div>

                    <button type="button" id="logout-button">
                        Sair
                    </button>
                </div>
            </section>

            <!-- FORMULÁRIO DE PRODUTOS -->
            <section class="admin-panel">
                <h2 id="form-title">Adicionar produto</h2>

                <form id="product-form">

                    <input type="hidden" id="product-id">

                    <div class="admin-form-grid">

                        <input
                            type="text"
                            id="name"
                            placeholder="Nome do produto"
                            required
                        >

                        <select id="category" required>
                            <option value="">Selecione a categoria</option>
                            <option value="Casaco">Casaco</option>
                            <option value="Sneakers">Sneakers</option>
                            <option value="Acessórios">Acessórios</option>
                            <option value="Tech">Tech</option>
                        </select>

                        <input
                            type="number"
                            id="price"
                            placeholder="Preço"
                            step="0.01"
                            min="0"
                            required
                        >

                        <input
                            type="text"
                            id="tag"
                            placeholder="Etiqueta (ex: Mais vendido)"
                        >

                        <input
                            type="url"
                            id="affiliate"
                            placeholder="Link de afiliado Shopee"
                            required
                        >

                        <input
                            type="file"
                            id="image"
                            accept="image/png,image/jpeg,image/webp"
                        >

                    </div>

                    <div id="image-preview"></div>

                    <div class="admin-actions">
                        <button type="submit" id="save-button">
                            Salvar produto
                        </button>

                        <button
                            type="button"
                            id="cancel-edit"
                            hidden
                        >
                            Cancelar edição
                        </button>
                    </div>

                    <p id="status"></p>

                </form>
            </section>

            <!-- LISTA DE PRODUTOS -->
            <section class="admin-panel">
                <h2>Produtos cadastrados</h2>
                <div id="admin-products"></div>
            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
