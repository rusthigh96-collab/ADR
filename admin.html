
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>ADR® — Admin</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="admin-body">

<div class="admin-wrap">

    <div class="admin-top">
        <div>
            <a href="index.html" class="logo">ADR<span>®</span></a>
            <p>DRIP CULTURE — PRODUCT CONTROL</p>
        </div>

        <div style="display:flex;gap:10px;align-items:center">
            <button id="logout-button" class="admin-secondary" type="button" hidden>
                SAIR
            </button>
            <a class="admin-back" href="index.html">← VOLTAR À LOJA</a>
        </div>
    </div>

    <!-- LOGIN -->
    <section class="admin-panel" id="login-panel">
        <span class="eyebrow">ADMIN ACCESS</span>
        <h2>ADMIN <span>LOGIN.</span></h2>

        <form id="login-form">
            <div class="admin-form-grid">
                <div class="admin-field full">
                    <label for="login-email">E-MAIL</label>
                    <input id="login-email" type="email" required autocomplete="username">
                </div>

                <div class="admin-field full">
                    <label for="login-password">SENHA</label>
                    <input id="login-password" type="password" required autocomplete="current-password">
                </div>
            </div>

            <div class="admin-actions">
                <button class="admin-primary" type="submit">ENTRAR ↗</button>
            </div>

            <p class="admin-status" id="login-status" role="status"></p>
        </form>
    </section>

    <!-- PAINEL -->
    <div id="admin-content" hidden>

        <section class="admin-panel">
            <span class="eyebrow">CATALOG MANAGEMENT</span>
            <h2 id="form-title">ADD NEW <span>PRODUCT.</span></h2>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="admin-form-grid">

                    <div class="admin-field">
                        <label for="name">NOME DO PRODUTO</label>
                        <input id="name" required maxlength="80" placeholder="Ex.: Nike Tech Fleece">
                    </div>

                    <div class="admin-field">
                        <label for="category">CATEGORIA</label>
                        <select id="category" required></select>

                        <button class="admin-secondary" id="create-category" type="button" style="margin-top:8px;width:100%">
                            + CRIAR CATEGORIA
                        </button>
                    </div>

                    <div class="admin-field">
                        <label for="price">PREÇO (R$)</label>
                        <input id="price" type="number" min="0.01" step="0.01" required placeholder="199.90">
                    </div>

                    <div class="admin-field">
                        <label for="tag">ETIQUETA / TAG</label>
                        <input id="tag" maxlength="24" placeholder="US DRIP">
                    </div>

                    <div class="admin-field full">
                        <label for="affiliate">LINK DE AFILIADO DA SHOPEE</label>
                        <input id="affiliate" type="url" required placeholder="https://s.shopee.com.br/...">
                    </div>

                    <div class="admin-field full">
                        <label for="image">FOTO DO PRODUTO</label>
                        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">

                        <small style="color:#777;font-size:10px">
                            JPG, PNG ou WEBP. Até 5 MB.
                        </small>

                        <img id="image-preview" class="image-preview" alt="Prévia da imagem selecionada">
                    </div>

                </div>

                <div class="admin-actions">
                    <button class="admin-primary" type="submit" id="save-button">
                        SAVE PRODUCT ↗
                    </button>

                    <button class="admin-secondary" type="button" id="cancel-edit" hidden>
                        CANCEL EDIT
                    </button>
                </div>

                <p class="admin-status" id="status" role="status"></p>
            </form>
        </section>

        <section class="admin-panel">
            <span class="eyebrow">CURRENT INVENTORY</span>
            <h2>YOUR <span>PRODUCTS.</span></h2>

            <div class="admin-products" id="admin-products"></div>

            <p class="admin-note">
                Produtos e imagens sincronizados com o Supabase.
            </p>
        </section>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>

</body>
</html>
